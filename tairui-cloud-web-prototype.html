<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泰瑞医疗云平台 Web端原型</title>
  <style>
    :root {
      --navy: #14233d;
      --navy-2: #1b3153;
      --primary: #2871f2;
      --primary-deep: #1959c8;
      --primary-soft: #eaf2ff;
      --cyan: #1eb6a5;
      --cyan-soft: #e8f8f5;
      --purple: #7165e8;
      --purple-soft: #efedff;
      --orange: #f59a52;
      --orange-soft: #fff2e8;
      --red: #e85b66;
      --red-soft: #fff0f1;
      --green: #18a878;
      --green-soft: #e9f8f2;
      --ink: #17243d;
      --text: #475571;
      --muted: #8b97ab;
      --line: #e7ecf4;
      --surface: #ffffff;
      --canvas: #f4f7fb;
      --shadow: 0 8px 26px rgba(31, 59, 108, .07);
      --sidebar: 236px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); transition: grid-template-columns .25s ease; }
    .app-shell.collapsed { --sidebar: 76px; }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #dbe7f8;
      background:
        radial-gradient(circle at 20% 8%, rgba(49, 132, 243, .22), transparent 28%),
        linear-gradient(180deg, var(--navy) 0%, #101d33 100%);
      box-shadow: 8px 0 30px rgba(15, 30, 52, .08);
    }

    .brand {
      height: 76px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 76px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-mark { width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center; border-radius: 13px; color: #fff; background: linear-gradient(145deg,#2e7df5,#28b3bd); box-shadow: 0 9px 20px rgba(25,103,215,.28); }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-copy { min-width: 0; white-space: nowrap; }
    .brand-copy strong { display: block; color: #fff; font-size: 16px; letter-spacing: .04em; }
    .brand-copy span { display: block; margin-top: 3px; color: #8295b3; font-size: 10px; }
    .collapsed .brand-copy { opacity: 0; width: 0; }

    .nav-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 10px; scrollbar-width: none; }
    .nav-scroll::-webkit-scrollbar { display: none; }
    .nav-section { margin: 6px 10px 8px; color: #7185a5; font-size: 10px; font-weight: 700; letter-spacing: .11em; white-space: nowrap; }
    .collapsed .nav-section { opacity: 0; height: 4px; margin: 2px 0; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 11px; color: #aabbd3; background: transparent; cursor: pointer; text-align: left; white-space: nowrap; transition: .18s ease; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.06); }
    .nav-item.active { color: #fff; background: linear-gradient(90deg,rgba(48,126,243,.32),rgba(49,129,244,.13)); font-weight: 700; }
    .nav-item.active::before { content:""; position:absolute; left:-10px; top:9px; bottom:9px; width:3px; border-radius:3px; background:#55b8ff; }
    .nav-icon { width: 22px; height: 22px; flex: 0 0 22px; display: grid; place-items: center; }
    .nav-icon svg { width: 19px; height: 19px; }
    .nav-label { overflow: hidden; transition: opacity .2s; }
    .collapsed .nav-label { opacity: 0; width: 0; }
    .nav-badge { margin-left:auto; min-width:18px; height:18px; display:grid; place-items:center; padding:0 5px; border-radius:9px; color:#fff; background:var(--red); font-size:9px; }
    .collapsed .nav-badge { position:absolute; right:6px; top:5px; min-width:7px; width:7px; height:7px; padding:0; font-size:0; }

    .sidebar-foot { flex: 0 0 auto; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }
    .admin-mini { display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; background:rgba(255,255,255,.055); }
    .admin-avatar { width:32px; height:32px; flex:0 0 32px; display:grid; place-items:center; border-radius:10px; color:#fff; background:linear-gradient(145deg,#6d79ea,#4e61be); font-size:11px; font-weight:700; }
    .admin-copy { flex:1; min-width:0; white-space:nowrap; }
    .admin-copy strong { display:block; color:#fff; font-size:11px; }
    .admin-copy span { display:block; color:#8192ad; font-size:9px; margin-top:2px; }
    .collapsed .admin-copy, .collapsed .admin-mini > svg { display:none; }

    .main-shell { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 15; height: 68px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .collapse-btn, .icon-btn { width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 11px; color: var(--text); background: #fff; cursor: pointer; }
    .collapse-btn:hover, .icon-btn:hover { color: var(--primary); border-color:#c8d9fb; background:var(--primary-soft); }
    .top-search { position: relative; width: min(380px, 36vw); }
    .top-search svg { position:absolute; left:12px; top:50%; width:16px; height:16px; color:var(--muted); transform:translateY(-50%); }
    .top-search input { width:100%; height:38px; padding:0 14px 0 38px; border:1px solid var(--line); border-radius:11px; outline:none; color:var(--ink); background:#f8fafc; font-size:11px; }
    .top-search input:focus { border-color:#adc8fb; background:#fff; box-shadow:0 0 0 3px rgba(40,113,242,.08); }
    .top-space { flex:1; }
    .system-status { display:flex; align-items:center; gap:7px; padding:7px 10px; border-radius:10px; color:var(--green); background:var(--green-soft); font-size:9px; }
    .system-status i { width:6px; height:6px; border-radius:50%; background:currentColor; box-shadow:0 0 0 4px rgba(24,168,120,.1); }
    .notify-wrap { position:relative; }
    .notify-dot { position:absolute; right:-1px; top:-2px; width:8px; height:8px; border:2px solid #fff; border-radius:50%; background:var(--red); }
    .top-admin { display:flex; align-items:center; gap:9px; padding-left:4px; }
    .top-admin .admin-avatar { width:34px; height:34px; }
    .top-admin strong { display:block; font-size:11px; }
    .top-admin span { display:block; color:var(--muted); font-size:9px; margin-top:2px; }

    .content { padding: 22px 24px 38px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; }
    .page-title h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
    .page-title p { margin:7px 0 0; color:var(--muted); font-size:11px; }
    .page-actions { display:flex; align-items:center; gap:9px; }

    .btn { height:36px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 14px; border:1px solid var(--line); border-radius:10px; color:var(--text); background:#fff; cursor:pointer; font-size:11px; transition:.17s ease; }
    .btn:hover { color:var(--primary); border-color:#b9cdf7; background:var(--primary-soft); }
    .btn.primary { color:#fff; border-color:var(--primary); background:linear-gradient(135deg,var(--primary),#3c88f3); box-shadow:0 7px 15px rgba(40,113,242,.18); }
    .btn.primary:hover { color:#fff; background:var(--primary-deep); }
    .btn.ghost { border-color:transparent; background:transparent; }
    .btn.danger { color:var(--red); border-color:#fac8cc; background:var(--red-soft); }
    .btn.small { height:30px; padding:0 10px; font-size:10px; border-radius:8px; }
    .btn svg { width:15px; height:15px; }

    .range-switch { display:inline-flex; padding:3px; border-radius:11px; background:#e9eef6; }
    .range-switch button { height:30px; min-width:52px; padding:0 10px; border:0; border-radius:8px; color:var(--muted); background:transparent; cursor:pointer; font-size:10px; }
    .range-switch button.active { color:var(--primary); background:#fff; font-weight:700; box-shadow:0 3px 8px rgba(36,58,98,.08); }

    .card { border:1px solid rgba(229,235,244,.95); border-radius:15px; background:#fff; box-shadow:var(--shadow); }
    .stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:14px; }
    .stat-card { position:relative; overflow:hidden; min-height:116px; padding:17px; }
    .stat-card::after { content:""; position:absolute; width:76px; height:76px; right:-28px; bottom:-35px; border-radius:50%; background:currentColor; opacity:.05; }
    .stat-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .stat-label { color:var(--muted); font-size:10px; }
    .stat-icon { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; }
    .stat-icon svg { width:18px; height:18px; }
    .stat-value { display:flex; align-items:baseline; gap:4px; margin-top:11px; }
    .stat-value strong { font-size:25px; letter-spacing:-.03em; }
    .stat-value span { color:var(--muted); font-size:10px; }
    .stat-foot { display:flex; align-items:center; gap:6px; margin-top:7px; color:var(--muted); font-size:9px; }
    .delta-up { color:var(--green); }
    .delta-down { color:var(--red); }
    .blue .stat-icon { color:var(--primary); background:var(--primary-soft); }
    .cyan .stat-icon { color:var(--cyan); background:var(--cyan-soft); }
    .purple .stat-icon { color:var(--purple); background:var(--purple-soft); }
    .orange .stat-icon { color:var(--orange); background:var(--orange-soft); }

    .dashboard-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(270px,.75fr); gap:14px; margin-bottom:14px; }
    .panel { padding:17px; }
    .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:14px; }
    .panel-head h2 { margin:0; font-size:14px; }
    .panel-head p { margin:5px 0 0; color:var(--muted); font-size:9px; }
    .panel-tools { display:flex; align-items:center; gap:8px; }
    .legend { display:flex; flex-wrap:wrap; gap:12px; }
    .legend span { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:9px; }
    .legend i { width:7px; height:7px; border-radius:50%; }

    .trend-chart { width:100%; height:246px; display:block; overflow:visible; }
    .trend-chart .grid { stroke:#edf1f6; stroke-width:1; }
    .trend-chart text { fill:#97a2b5; font-size:9px; }
    .trend-chart .area { fill:url(#dashArea); }
    .trend-chart .line { fill:none; stroke:var(--primary); stroke-width:2.7; stroke-linecap:round; stroke-linejoin:round; }
    .trend-chart .line2 { fill:none; stroke:var(--cyan); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .trend-chart .dot { fill:#fff; stroke:var(--primary); stroke-width:2; }

    .donut-wrap { display:grid; place-items:center; padding:3px 0 10px; }
    .donut { --p:84%; position:relative; width:150px; height:150px; display:grid; place-items:center; border-radius:50%; background:conic-gradient(var(--primary) 0 61%,var(--cyan) 61% 84%,#e6ebf3 84%); }
    .donut::before { content:""; position:absolute; width:105px; height:105px; border-radius:50%; background:#fff; }
    .donut-copy { position:relative; z-index:1; text-align:center; }
    .donut-copy strong { display:block; font-size:26px; }
    .donut-copy span { color:var(--muted); font-size:9px; }
    .device-legend { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
    .device-legend div { padding:10px; border-radius:11px; background:#f7f9fc; }
    .device-legend span { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:9px; }
    .device-legend i { width:7px; height:7px; border-radius:50%; }
    .device-legend strong { display:block; margin-top:5px; font-size:14px; }

    .bottom-grid { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr); gap:14px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th { padding:11px 12px; color:var(--muted); background:#f8fafc; font-size:9px; font-weight:650; text-align:left; white-space:nowrap; }
    td { padding:12px; border-bottom:1px solid var(--line); color:var(--text); font-size:10px; vertical-align:middle; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr.clickable { cursor:pointer; }
    tbody tr.clickable:hover td { background:#f8fbff; }
    .cell-main { display:flex; align-items:center; gap:9px; min-width:145px; }
    .cell-avatar { width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border-radius:9px; color:var(--primary); background:var(--primary-soft); font-size:9px; font-weight:700; }
    .cell-copy strong { display:block; color:var(--ink); font-size:10px; font-weight:650; }
    .cell-copy span { display:block; color:var(--muted); font-size:8px; margin-top:3px; }
    .status { display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border-radius:8px; font-size:8px; white-space:nowrap; }
    .status::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
    .status.online, .status.done { color:var(--green); background:var(--green-soft); }
    .status.running { color:var(--primary); background:var(--primary-soft); }
    .status.offline { color:var(--muted); background:#eef1f5; }
    .status.warning { color:var(--orange); background:var(--orange-soft); }
    .status.error { color:var(--red); background:var(--red-soft); }
    .status.syncing { color:var(--purple); background:var(--purple-soft); }
    .rank { width:22px; height:22px; display:grid; place-items:center; border-radius:7px; color:var(--muted); background:#f0f3f7; font-size:9px; }
    .rank.top { color:#9b6512; background:#fff0c6; font-weight:700; }
    .progress { width:90px; height:6px; border-radius:5px; background:#edf1f6; overflow:hidden; }
    .progress i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--primary),#50b0ef); }

    .alert-list { display:grid; gap:9px; }
    .alert-item { display:flex; align-items:flex-start; gap:10px; padding:11px; border-radius:11px; background:#f8fafc; cursor:pointer; }
    .alert-item:hover { background:#f1f6ff; }
    .alert-icon { width:29px; height:29px; flex:0 0 29px; display:grid; place-items:center; border-radius:9px; }
    .alert-icon svg { width:15px; height:15px; }
    .alert-copy { flex:1; min-width:0; }
    .alert-copy strong { display:block; font-size:10px; }
    .alert-copy span { display:block; margin-top:4px; color:var(--muted); font-size:8px; line-height:1.4; }
    .alert-time { color:var(--muted); font-size:8px; white-space:nowrap; }

    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:13px; margin-bottom:13px; }
    .search-field { position:relative; width:240px; }
    .search-field svg { position:absolute; left:11px; top:50%; width:15px; height:15px; color:var(--muted); transform:translateY(-50%); }
    .field, .select { height:34px; border:1px solid var(--line); border-radius:9px; outline:none; color:var(--text); background:#fff; font-size:10px; }
    .field { width:100%; padding:0 11px 0 34px; }
    .select { min-width:112px; padding:0 28px 0 10px; }
    .field:focus, .select:focus { border-color:#adc7f7; box-shadow:0 0 0 3px rgba(40,113,242,.07); }
    .toolbar-spacer { flex:1; }
    .result-count { color:var(--muted); font-size:9px; }

    .page-card { overflow:hidden; }
    .table-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
    .table-head h2 { margin:0; font-size:13px; }
    .table-head span { color:var(--muted); font-size:9px; }
    .pagination { display:flex; align-items:center; justify-content:space-between; padding:12px 15px; border-top:1px solid var(--line); color:var(--muted); font-size:9px; }
    .page-buttons { display:flex; gap:5px; }
    .page-buttons button { width:27px; height:27px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:9px; }
    .page-buttons button.active { color:#fff; border-color:var(--primary); background:var(--primary); }

    .two-col { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr); gap:14px; }
    .store-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; }
    .store-card { overflow:hidden; cursor:pointer; }
    .store-cover { position:relative; height:88px; display:flex; align-items:flex-end; padding:13px; color:#fff; background:linear-gradient(135deg,#2772ef,#28aaa9); }
    .store-cover::after { content:""; position:absolute; width:110px; height:110px; right:-35px; top:-55px; border:20px solid rgba(255,255,255,.08); border-radius:50%; }
    .store-cover.purple { background:linear-gradient(135deg,#6659d7,#9483eb); }
    .store-cover.orange { background:linear-gradient(135deg,#e98445,#f3b463); }
    .store-cover strong { position:relative; z-index:1; font-size:12px; }
    .store-body { padding:13px; }
    .store-line { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .store-line span { color:var(--muted); font-size:8px; }
    .store-kpis { display:grid; grid-template-columns:repeat(3,1fr); margin-top:12px; padding-top:11px; border-top:1px solid var(--line); }
    .store-kpis div { text-align:center; }
    .store-kpis strong { display:block; font-size:12px; }
    .store-kpis span { color:var(--muted); font-size:8px; }

    .report-layout { display:grid; grid-template-columns:360px minmax(0,1fr); gap:14px; }
    .report-list { overflow:hidden; }
    .report-filter { padding:13px; border-bottom:1px solid var(--line); }
    .report-items { max-height:650px; overflow:auto; }
    .report-item { display:flex; align-items:center; gap:10px; padding:13px; border-bottom:1px solid var(--line); cursor:pointer; }
    .report-item:hover, .report-item.active { background:#f5f8ff; }
    .report-item.active { box-shadow:inset 3px 0 0 var(--primary); }
    .report-score { width:40px; height:40px; flex:0 0 40px; display:grid; place-items:center; border-radius:12px; color:var(--purple); background:var(--purple-soft); font-size:13px; font-weight:700; }
    .report-item-copy { flex:1; min-width:0; }
    .report-item-copy strong { display:block; font-size:10px; }
    .report-item-copy span { display:block; margin-top:4px; color:var(--muted); font-size:8px; }
    .report-preview { padding:18px; }
    .report-user { display:flex; align-items:center; gap:11px; }
    .report-user .cell-avatar { width:40px; height:40px; flex-basis:40px; border-radius:12px; }
    .report-user strong { display:block; font-size:13px; }
    .report-user span { display:block; margin-top:3px; color:var(--muted); font-size:9px; }
    .report-summary { display:grid; grid-template-columns:180px 1fr; gap:20px; align-items:center; margin-top:18px; padding:17px; border-radius:14px; background:linear-gradient(145deg,#f8f7ff,#f4f9ff); }
    .radar { position:relative; width:150px; height:150px; margin:auto; }
    .radar-ring { position:absolute; inset:0; border:1px solid #d9dff0; transform:rotate(45deg); border-radius:34px; }
    .radar-ring:nth-child(2) { inset:25px; border-radius:23px; }
    .radar-ring:nth-child(3) { inset:50px; border-radius:12px; }
    .radar-shape { position:absolute; inset:22px; clip-path:polygon(50% 0,93% 29%,84% 83%,48% 100%,6% 67%,13% 18%); background:rgba(113,101,232,.23); border:2px solid var(--purple); }
    .report-score-big strong { display:block; font-size:30px; }
    .report-score-big span { color:var(--muted); font-size:9px; }
    .report-score-big p { margin:9px 0 0; color:var(--text); font-size:10px; line-height:1.6; }
    .indicator-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    .indicator { padding:12px; border:1px solid var(--line); border-radius:11px; }
    .indicator-head { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:9px; }
    .indicator-head strong { color:var(--ink); font-size:11px; }
    .indicator .progress { width:100%; margin-top:9px; }

    .source-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin-bottom:14px; }
    .source-card { padding:15px; }
    .source-top { display:flex; align-items:flex-start; gap:11px; }
    .source-logo { width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; border-radius:12px; color:var(--primary); background:var(--primary-soft); }
    .source-logo svg { width:20px; height:20px; }
    .source-copy { flex:1; min-width:0; }
    .source-copy strong { display:block; font-size:11px; }
    .source-copy span { display:block; margin-top:4px; color:var(--muted); font-size:8px; }
    .source-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:13px; }
    .source-meta div { padding:8px; border-radius:9px; background:#f7f9fc; }
    .source-meta span { display:block; color:var(--muted); font-size:8px; }
    .source-meta strong { display:block; margin-top:4px; font-size:10px; }

      const pa=points(d.a),pb=points(d.b),path=pts=>pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

      {id:'oxygen',name:'氧舱物联网数据',desc:'在线状态、运行参数及使用记录',icon:'oxygen',count:'8,624,912',time:'刚刚',status:'online'},
      {id:'bracelet',name:'手环健康数据',desc:'血氧、心率、睡眠等用户指标',icon:'heart',count:'36,218,504',time:'刚刚',status:'online'},
      {id:'multi',name:'多模态检测设备',desc:'原始检测数据与分析报告',icon:'report',count:'248,106',time:'2分钟前',status:'online'}
    ];
    function integrationPage(){
      return `${pageHead('数据接入中心','统一管理原业务系统、智能设备与检测设备的数据同步、异常和对账。',`<button class="btn primary" data-action="sync-all">${icon('sync')}全部立即同步</button>`)}<div class="source-grid">${sources.map(s=>`<article class="source-card card"><div class="source-top"><span class="source-logo">${icon(s.icon)}</span><div class="source-copy"><strong>${s.name}</strong><span>${s.desc}</span></div><span class="status ${(state.syncing==='all'||state.syncing===s.id)?'syncing':s.status}">${(state.syncing==='all'||state.syncing===s.id)?'同步中':s.status==='online'?'运行正常':'部分异常'}</span></div><div class="source-meta"><div><span>累计接入数据</span><strong>${s.count} 条</strong></div><div><span>最近同步</span><strong>${(state.syncing==='all'||state.syncing===s.id)?'正在同步…':s.time}</strong></div></div><div class="source-actions"><span style="color:var(--muted);font-size:8px">增量同步 · 自动重试</span><button class="btn ghost small" data-action="sync-source" data-source="${s.id}">${icon('sync')}立即同步</button></div></article>`).join('')}</div><div class="two-col"><section class="flow-card card"><div class="panel-head"><div><h2>泰瑞数据汇聚关系</h2><p>原业务系统与智能设备数据统一进入泰瑞医疗云平台</p></div></div><div class="data-flow"><div class="flow-group"><div class="flow-node">${icon('store')}原商城小程序</div><div class="flow-node">${icon('database')}原门店系统</div></div><i class="flow-arrow"></i><div class="flow-center">${icon('cloud')}<strong>泰瑞医疗云平台</strong><span>用户统一 · 数据汇总 · 综合分析</span></div><i class="flow-arrow"></i><div class="flow-group"><div class="flow-node">${icon('device')}C端小程序展示</div><div class="flow-node">${icon('chart')}经营数据分析</div></div></div></section><section class="page-card card"><div class="table-head"><h2>最近同步任务</h2><span>实时更新</span></div><div class="table-wrap"><table><thead><tr><th>数据源</th><th>结果</th><th>处理量</th><th>耗时</th></tr></thead><tbody><tr><td>氧舱物联网</td><td><span class="status done">成功</span></td><td>1,286条</td><td>4.2秒</td></tr><tr><td>手环健康数据</td><td><span class="status done">成功</span></td><td>8,624条</td><td>12.8秒</td></tr><tr><td>原门店系统</td><td><span class="status warning">部分失败</span></td><td>618 / 630条</td><td>9.6秒</td></tr><tr><td>原商城小程序</td><td><span class="status done">成功</span></td><td>326条</td><td>3.1秒</td></tr></tbody></table></div></section></div>`;
    }

    function placeholderPage(type){return `${pageHead(type==='analytics'?'数据分析中心':'系统管理',type==='analytics'?'面向总部运营的专题分析与报表中心。':'管理总部账号、角色权限、系统参数、消息和审计日志。')}<section class="panel card"><div class="panel-head"><div><h2>${type==='analytics'?'专题分析':'基础配置'}</h2><p>本次原型聚焦主要业务页面，该模块展示为结构占位。</p></div></div><div class="stats-grid" style="margin:20px 0 0">${type==='analytics'?statCard('blue','用户分析','12','个专题','+2','users')+statCard('cyan','设备分析','8','个专题','+1','device')+statCard('purple','氧疗分析','10','个专题','+3','oxygen')+statCard('orange','经营报表','26','张','+4','chart'):statCard('blue','总部账号','18','个','+1','user')+statCard('cyan','角色权限','6','组','0','shield')+statCard('purple','操作日志','12,684','条','+8.6%','report')+statCard('orange','安全告警','0','项','0','alert')}</div></section>`;}

    const renderers={dashboard:dashboardPage,devices:devicesPage,users:usersPage,oxygen:oxygenPage,stores:storesPage,reports:reportsPage,integration:integrationPage,analytics:()=>placeholderPage('analytics'),settings:()=>placeholderPage('settings')};
    function renderNav(){document.getElementById('mainNav').innerHTML=mainNav.map(n=>`<button class="nav-item ${state.page===n.id?'active':''}" data-action="go" data-page="${n.id}"><span class="nav-icon">${icon(n.icon)}</span><span class="nav-label">${n.label}</span>${n.badge?`<span class="nav-badge">${n.badge}</span>`:''}</button>`).join('');document.getElementById('systemNav').innerHTML=systemNav.map(n=>`<button class="nav-item ${state.page===n.id?'active':''}" data-action="go" data-page="${n.id}"><span class="nav-icon">${icon(n.icon)}</span><span class="nav-label">${n.label}</span></button>`).join('');}
    function render(){renderNav();document.getElementById('content').innerHTML=renderers[state.page]();}
    function navigate(page){if(!renderers[page])return;state.page=page;render();document.querySelector('.content').scrollTop=0;window.scrollTo({top:0,behavior:'smooth'});}
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}
    function openDrawer(title,html){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=html;document.getElementById('drawerLayer').classList.add('show');}
    function closeDrawer(){document.getElementById('drawerLayer').classList.remove('show');}
    function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalLayer').classList.add('show');}
    function closeModal(){document.getElementById('modalLayer').classList.remove('show');}

    function deviceDetail(id){const d=devices.find(x=>x.id===id)||devices[0];openDrawer('设备详情',`<div class="detail-hero"><div class="detail-hero-top"><div><strong>${d.name}</strong><p>${d.id} · ${d.type}</p></div><span class="status ${d.status}" style="background:rgba(255,255,255,.16);color:#fff">${d.status==='online'?'设备在线':d.status==='offline'?'设备离线':'维护中'}</span></div><div class="detail-kpis"><div><span>当前状态</span><strong>${d.run}</strong></div><div><span>累计使用</span><strong>${d.used}</strong></div><div><span>最后通信</span><strong>${d.last}</strong></div></div></div><div class="drawer-tabs"><button class="active">基础信息</button><button>运行数据</button><button>使用记录</button><button>告警维修</button></div><div class="detail-section"><h3>设备基础信息</h3><div class="detail-info"><div><span>业务归属</span><strong>${d.owner}</strong></div><div><span>当前归属</span><strong>${d.ownerName}</strong></div><div><span>所在城市</span><strong>${d.city}</strong></div><div><span>设备型号</span><strong>${d.type==='氧舱'?'T3 标准版':d.type==='手环'?'S2 标准版':'M1 一体机'}</strong></div><div><span>激活时间</span><strong>2026-05-18</strong></div><div><span>固件版本</span><strong>v2.6.3</strong></div></div></div><div class="detail-section"><h3>近7日运行趋势</h3><svg class="mini-trend" viewBox="0 0 480 120"><path d="M18 92 C65 80,78 88,116 63 S182 74,222 51 S289 66,332 37 S404 51,462 24" fill="none" stroke="#2871f2" stroke-width="3"/><path d="M18 92 C65 80,78 88,116 63 S182 74,222 51 S289 66,332 37 S404 51,462 24 L462 110 L18 110Z" fill="#2871f2" opacity=".08"/></svg></div><div class="modal-actions"><button class="btn" data-action="toast" data-message="设备运行日志已导出">${icon('export')}导出日志</button><button class="btn primary" data-action="toast" data-message="已进入远程监控">${icon('eye')}实时监控</button></div>`);}

    function userDetail(id){const u=users.find(x=>x.id===id)||users[0];openDrawer('统一用户档案',`<div class="detail-hero" style="background:linear-gradient(135deg,#6258d6,#7f72e6 55%,#3c9bc5)"><div class="detail-hero-top"><div><strong>${u.name}</strong><p>${u.phone} · ${u.id}</p></div><span class="status online" style="background:rgba(255,255,255,.16);color:#fff">${u.member}</span></div><div class="detail-kpis"><div><span>绑定设备</span><strong>${u.device}</strong></div><div><span>氧疗次数</span><strong>${u.oxygen}</strong></div><div><span>累计消费</span><strong>${u.spent}</strong></div></div></div><div class="drawer-tabs"><button class="active">用户概览</button><button>健康数据</button><button>设备关系</button><button>消费记录</button></div><div class="detail-section"><h3>健康概览</h3><div class="detail-info"><div><span>综合健康指数</span><strong class="delta-up">86 · 状态良好</strong></div><div><span>最近血氧</span><strong>98%</strong></div><div><span>静息心率</span><strong>72 bpm</strong></div><div><span>最近检测报告</span><strong>82 分</strong></div></div></div><div class="detail-section"><h3>用户数据关系</h3><div class="alert-list"><div class="alert-item"><span class="alert-icon" style="color:var(--primary);background:var(--primary-soft)">${icon('device')}</span><div class="alert-copy"><strong>设备数据</strong><span>已关联个人氧舱、手环及36次设备使用记录</span></div></div><div class="alert-item"><span class="alert-icon" style="color:var(--cyan);background:var(--cyan-soft)">${icon('oxygen')}</span><div class="alert-copy"><strong>氧疗与门店服务</strong><span>家庭氧疗28次，门店氧疗8次</span></div></div><div class="alert-item"><span class="alert-icon" style="color:var(--orange);background:var(--orange-soft)">${icon('order')}</span><div class="alert-copy"><strong>商城与会员数据</strong><span>${u.member} · 累计消费 ${u.spent}</span></div></div></div></div>`);}

    function oxygenDetail(id){const r=oxygenRecords.find(x=>x.id===id)||oxygenRecords[0];openDrawer('氧疗记录详情',`<div class="detail-hero"><div class="detail-hero-top"><div><strong>${r.type} · ${r.mode}</strong><p>${r.id} · ${r.time}</p></div><span class="status done" style="background:rgba(255,255,255,.16);color:#fff">已完成</span></div><div class="detail-kpis"><div><span>使用时长</span><strong>${r.duration}</strong></div><div><span>氧疗前血氧</span><strong>${r.before}</strong></div><div><span>氧疗后血氧</span><strong>${r.after}</strong></div></div></div><div class="detail-section"><h3>关联信息</h3><div class="detail-info"><div><span>使用用户</span><strong>${r.user}</strong></div><div><span>设备与地点</span><strong>${r.place}</strong></div><div><span>氧舱数据</span><strong>完整</strong></div><div><span>手环健康数据</span><strong class="delta-up">完整</strong></div></div></div><div class="detail-section"><h3>本次健康数据趋势</h3><svg class="mini-trend" viewBox="0 0 480 120"><path d="M18 84 C70 85,97 75,138 72 S210 62,255 57 S340 43,385 38 S430 31,462 27" fill="none" stroke="#1eb6a5" stroke-width="3"/><path d="M18 84 C70 85,97 75,138 72 S210 62,255 57 S340 43,385 38 S430 31,462 27 L462 110 L18 110Z" fill="#1eb6a5" opacity=".1"/></svg></div><div class="detail-section"><h3>系统分析</h3><div class="alert-item" style="background:var(--green-soft)"><span class="alert-icon" style="color:var(--green);background:#fff">${icon('check')}</span><div class="alert-copy"><strong>本次氧疗数据表现良好</strong><span>血氧提升 ${parseInt(r.after)-parseInt(r.before)}%，氧疗过程中心率保持平稳，未出现异常设备告警。</span></div></div></div>`);}

    function storeDetail(name){openDrawer('门店经营详情',`<div class="detail-hero" style="background:linear-gradient(135deg,#188f83,#25b6a5 55%,#368cdf)"><div class="detail-hero-top"><div><strong>泰瑞氧疗中心（${name}）</strong><p>数据同步自客户原门店系统</p></div><span class="status online" style="background:rgba(255,255,255,.16);color:#fff">营业中</span></div><div class="detail-kpis"><div><span>本月服务</span><strong>1,286 次</strong></div><div><span>设备使用率</span><strong>86%</strong></div><div><span>本月收入</span><strong>¥128,600</strong></div></div></div><div class="detail-section"><h3>门店档案</h3><div class="detail-info"><div><span>门店类型</span><strong>合作体验门店</strong></div><div><span>营业时间</span><strong>09:00–21:00</strong></div><div><span>投放氧舱</span><strong>8 台</strong></div><div><span>检测设备</span><strong>2 台</strong></div></div></div><div class="detail-section"><h3>近7日服务趋势</h3><svg class="mini-trend" viewBox="0 0 480 120"><path d="M18 88 C60 75,92 79,132 64 S205 70,246 49 S323 57,365 36 S423 44,462 28" fill="none" stroke="#2871f2" stroke-width="3"/><path d="M18 88 C60 75,92 79,132 64 S205 70,246 49 S323 57,365 36 S423 44,462 28 L462 110 L18 110Z" fill="#2871f2" opacity=".08"/></svg></div><div class="detail-section"><h3>设备概况</h3><div class="alert-list"><div class="alert-item"><span class="alert-icon" style="color:var(--green);background:var(--green-soft)">${icon('device')}</span><div class="alert-copy"><strong>7台设备在线</strong><span>当前2台运行中，5台空闲</span></div></div><div class="alert-item"><span class="alert-icon" style="color:var(--red);background:var(--red-soft)">${icon('alert')}</span><div class="alert-copy"><strong>1台设备离线</strong><span>TR-T3-01442 已离线36分钟</span></div></div></div></div>`);}

    function addDeviceModal(){openModal('设备登记录入',`<div class="form-grid"><div class="form-item"><label>设备类型</label><select><option>氧舱</option><option>手环</option><option>多模态检测设备</option></select></div><div class="form-item"><label>设备型号</label><select><option>泰瑞智能氧舱 T3</option><option>泰瑞健康手环 S2</option></select></div><div class="form-item"><label>设备序列号</label><input placeholder="请输入或扫描设备编号"></div><div class="form-item"><label>设备批次</label><input value="2026-08"></div><div class="form-item"><label>业务归属</label><select><option>暂未分配</option><option>个人已售</option><option>门店投放</option></select></div><div class="form-item"><label>登记仓库</label><select><option>总部设备仓</option></select></div><div class="form-item full"><label>备注</label><input placeholder="选填，填写设备登记说明"></div></div><div class="modal-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-device">确认登记</button></div>`);}

    function doSync(id){if(state.syncing)return;state.syncing=id;render();setTimeout(()=>{state.syncing=null;render();toast('数据同步完成，未发现新增异常');},1100);}

    document.addEventListener('click',e=>{
      const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;
      if(a==='go')navigate(t.dataset.page);
      if(a==='collapse')document.getElementById('appShell').classList.toggle('collapsed');
      if(a==='range'){state.range=t.dataset.range;render();}
      if(a==='export')toast('报表导出任务已创建');
      if(a==='device-detail')deviceDetail(t.dataset.id);
      if(a==='user-detail')userDetail(t.dataset.user);
      if(a==='oxygen-detail')oxygenDetail(t.dataset.record);
      if(a==='store-detail')storeDetail(t.dataset.store);
      if(a==='close-drawer')closeDrawer();
      if(a==='add-device')addDeviceModal();
      if(a==='close-modal')closeModal();
      if(a==='save-device'){closeModal();toast('设备登记成功');}
      if(a==='notifications')document.getElementById('notifyPopover').classList.toggle('show');
      if(a==='read-all'){document.querySelector('.notify-dot').style.display='none';document.getElementById('notifyPopover').classList.remove('show');toast('通知已全部标记为已读');}
      if(a==='toast')toast(t.dataset.message||'操作成功');
      if(a==='oxygen-filter'){state.oxygenType=t.dataset.type;render();}
      if(a==='select-report'){state.selectedReport=Number(t.dataset.index);render();}
      if(a==='report-detail')openDrawer('多模态完整检测报告',document.querySelector('.report-preview').innerHTML);
      if(a==='sync-source')doSync(t.dataset.source);
      if(a==='sync-all')doSync('all');
      if(a==='sync-one')toast(`${t.dataset.source}同步任务已启动`);
    });
    document.addEventListener('change',e=>{
      const t=e.target;
      if(t.dataset.action==='device-type'){state.deviceType=t.value;render();}
      if(t.dataset.action==='device-status'){state.deviceStatus=t.value;render();}
    });
    document.addEventListener('input',e=>{
      const t=e.target;
      if(t.dataset.action==='device-search'){
        state.deviceSearch=t.value;
        const key=t.value.trim().toLowerCase();
        const rows=[...document.querySelectorAll('tbody tr.clickable')];
        let visible=0;
        rows.forEach(row=>{const show=!key||row.innerText.toLowerCase().includes(key);row.style.display=show?'':'none';if(show)visible++;});
        const count=document.querySelector('.result-count');
        if(count)count.textContent=`共 ${visible} 条示例数据`;
      }
      if(t.dataset.action==='user-search'){
        state.userSearch=t.value;
        const key=t.value.trim().toLowerCase();
        document.querySelectorAll('tbody tr.clickable').forEach(row=>{row.style.display=!key||row.innerText.toLowerCase().includes(key)?'':'none';});
      }
      if(t.dataset.action==='global-search'&&t.value.length>1)toast('全局搜索将在正式系统中匹配用户、设备、订单和门店');
    });
    document.getElementById('drawerLayer').addEventListener('click',e=>{if(e.target.id==='drawerLayer')closeDrawer();});
    document.getElementById('modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')closeModal();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal();document.getElementById('notifyPopover').classList.remove('show');}});

    document.getElementById('brandMark').innerHTML=icon('logo');
    document.getElementById('collapseIcon').innerHTML=icon('menu');
    document.getElementById('topSearchIcon').innerHTML=icon('search');
    document.getElementById('notifyIcon').innerHTML=icon('bell');
    document.getElementById('sideChevron').innerHTML=icon('chevron',14);
    document.getElementById('drawerClose').innerHTML=icon('close');
    document.getElementById('modalClose').innerHTML=icon('close');
    document.getElementById('popWarn1').innerHTML=icon('alert');
    document.getElementById('popWarn2').innerHTML=icon('sync');
    render();
  </script>
</body>
</html>
