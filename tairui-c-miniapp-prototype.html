<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>泰瑞之家 C端小程序原型</title>
  <style>
    :root {
      --brand: #276ef1;
      --brand-deep: #1554c4;
      --brand-soft: #eaf1ff;
      --aqua: #1fb7a6;
      --aqua-soft: #e7f8f5;
      --orange: #ff9b51;
      --orange-soft: #fff2e8;
      --purple: #7c6cf2;
      --purple-soft: #f0edff;
      --ink: #17243f;
      --text: #46536c;
      --muted: #8a96ab;
      --line: #e8edf5;
      --surface: #ffffff;
      --canvas: #f3f6fb;
      --success: #19a974;
      --danger: #ed5b65;
      --shadow: 0 14px 40px rgba(35, 64, 120, .12);
      --phone-w: 390px;
      --phone-h: 844px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 13% 13%, rgba(39, 110, 241, .13), transparent 28%),
        radial-gradient(circle at 86% 84%, rgba(31, 183, 166, .12), transparent 26%),
        #eef3fa;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .prototype-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage { display: grid; place-items: center; min-width: 0; }

    .phone {
      position: relative;
      width: var(--phone-w);
      height: min(var(--phone-h), calc(100vh - 42px));
      min-height: 680px;
      overflow: hidden;
      border: 8px solid #101827;
      border-radius: 48px;
      background: var(--canvas);
      box-shadow: 0 30px 80px rgba(24, 46, 87, .26), inset 0 0 0 1px rgba(255,255,255,.15);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 20;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 25px;
      border-radius: 18px;
      background: #101827;
      pointer-events: none;
    }

    .phone-inner { height: 100%; display: flex; flex-direction: column; }

    .statusbar {
      position: relative;
      z-index: 5;
      height: 38px;
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 19px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      background: rgba(255,255,255,.93);
    }

    .status-icons { display: flex; align-items: center; gap: 5px; }
    .signal { display: flex; align-items: end; gap: 2px; height: 10px; }
    .signal i { display: block; width: 2px; border-radius: 1px; background: currentColor; }
    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }
    .battery { width: 20px; height: 10px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; position: relative; }
    .battery::before { content: ""; display: block; width: 85%; height: 100%; border-radius: 1px; background: currentColor; }
    .battery::after { content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: currentColor; }

    .appbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px 10px;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid rgba(228, 234, 244, .75);
    }

    .appbar-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .appbar-logo { width: 31px; height: 31px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, var(--brand), #25b1c1); }
    .appbar-logo svg { width: 18px; height: 18px; }
    .appbar-copy strong { display: block; font-size: 16px; font-weight: 750; }
    .appbar-copy span { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }

    .back-btn, .circle-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #f5f7fb;
      cursor: pointer;
    }

    .back-btn:hover, .circle-btn:hover { background: var(--brand-soft); color: var(--brand); }

    .appbar-heading {
      flex: 1;
      font-size: 16px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-capsule {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: #28344b;
      background: rgba(255,255,255,.85);
    }

    .mini-capsule i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; box-shadow: 7px 0 0 currentColor, -7px 0 0 currentColor; }
    .mini-capsule b { width: 1px; height: 15px; background: var(--line); }
    .mini-capsule span { width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 50%; }

    .screen {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 14px 14px 24px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar { display: none; }

    .tabbar {
      position: relative;
      z-index: 8;
      height: 68px;
      flex: 0 0 68px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 5px 8px 7px;
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -7px 20px rgba(41, 61, 99, .04);
    }

    .tabbar button {
      border: 0;
      background: transparent;
      display: grid;
      justify-items: center;
      gap: 3px;
      color: #9aa4b5;
      font-size: 10px;
      cursor: pointer;
    }

    .tabbar button svg { width: 22px; height: 22px; }
    .tabbar button.active { color: var(--brand); font-weight: 700; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 2px 10px;
    }

    .section-head.first { margin-top: 2px; }
    .section-head h2 { margin: 0; font-size: 16px; font-weight: 750; }
    .section-head span { color: var(--muted); font-size: 11px; }
    .text-link { border: 0; padding: 4px 0; color: var(--brand); background: transparent; font-size: 12px; cursor: pointer; }

    .card {
      border: 1px solid rgba(230,235,244,.9);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 6px 20px rgba(50, 76, 124, .055);
    }

    .greeting { display: flex; align-items: center; justify-content: space-between; margin: 1px 2px 14px; }
    .greeting h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    .greeting p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .avatar { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; color: #fff; font-weight: 700; background: linear-gradient(145deg,#94aaf6,#6f67da); box-shadow: 0 8px 16px rgba(105, 102, 217, .2); }

    .hero-health {
      position: relative;
      overflow: hidden;
      min-height: 172px;
      padding: 18px;
      color: #fff;
      border-radius: 22px;
      background: linear-gradient(135deg, #1e66e9 0%, #2c81ed 48%, #27aea9 120%);
      box-shadow: 0 15px 30px rgba(34, 105, 215, .22);
    }

    .hero-health::before, .hero-health::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.09); }
    .hero-health::before { width: 155px; height: 155px; right: -55px; top: -72px; }
    .hero-health::after { width: 96px; height: 96px; right: 67px; bottom: -62px; }
    .hero-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
    .hero-kicker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.83); }
    .hero-kicker i { width: 7px; height: 7px; border-radius: 50%; background: #84f1d1; box-shadow: 0 0 0 4px rgba(132,241,209,.15); }
    .hero-date { font-size: 11px; color: rgba(255,255,255,.72); }
    .hero-body { position: relative; z-index: 1; display: flex; align-items: center; gap: 18px; margin-top: 16px; }
    .score-ring { position: relative; width: 91px; height: 91px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(#8cf0d6 0 86%, rgba(255,255,255,.18) 86%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
    .score-ring::before { content: ""; position: absolute; width: 72px; height: 72px; border-radius: 50%; background: #2b78e7; }
    .score-value { position: relative; z-index: 1; text-align: center; }
    .score-value strong { display: block; font-size: 27px; line-height: 1; }
    .score-value span { font-size: 9px; color: rgba(255,255,255,.78); }
    .hero-summary { flex: 1; }
    .hero-summary strong { display: block; font-size: 16px; }
    .hero-summary p { margin: 6px 0 12px; font-size: 11px; line-height: 1.55; color: rgba(255,255,255,.78); }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .hero-tag { padding: 5px 8px; border-radius: 10px; background: rgba(255,255,255,.14); font-size: 9px; }

    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .quick-item { border: 0; padding: 11px 3px 8px; border-radius: 15px; background: #fff; cursor: pointer; }
    .quick-icon { width: 38px; height: 38px; display: grid; place-items: center; margin: 0 auto 7px; border-radius: 13px; }
    .quick-icon svg { width: 20px; height: 20px; }
    .quick-item span { display: block; font-size: 10px; color: var(--text); }
    .quick-item:nth-child(1) .quick-icon { color: var(--brand); background: var(--brand-soft); }
    .quick-item:nth-child(2) .quick-icon { color: var(--aqua); background: var(--aqua-soft); }
    .quick-item:nth-child(3) .quick-icon { color: var(--purple); background: var(--purple-soft); }
    .quick-item:nth-child(4) .quick-icon { color: var(--orange); background: var(--orange-soft); }

    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric-card { padding: 12px 11px; }
    .metric-card .metric-label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
    .metric-card .metric-label svg { width: 13px; height: 13px; }
    .metric-card strong { display: inline-block; margin-top: 8px; font-size: 18px; }
    .metric-card em { color: var(--muted); font-size: 9px; font-style: normal; margin-left: 2px; }
    .metric-card small { display: block; color: var(--success); font-size: 9px; margin-top: 4px; }

    .session-card { padding: 14px; cursor: pointer; }
    .session-main { display: flex; align-items: center; gap: 12px; }
    .session-icon { width: 46px; height: 46px; flex: 0 0 46px; display: grid; place-items: center; color: var(--brand); border-radius: 15px; background: var(--brand-soft); }
    .session-icon svg { width: 24px; height: 24px; }
    .session-copy { min-width: 0; flex: 1; }
    .session-copy strong { display: block; font-size: 13px; }
    .session-copy span { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
    .session-result { display: flex; align-items: center; gap: 8px; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
    .result-point { flex: 1; }
    .result-point span { color: var(--muted); font-size: 9px; }
    .result-point strong { display: block; margin-top: 2px; font-size: 13px; }
    .result-arrow { color: var(--success); font-weight: 800; }
    .positive { color: var(--success); }

    .external-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .external-card { position: relative; overflow: hidden; padding: 14px; min-height: 110px; border: 0; text-align: left; cursor: pointer; }
    .external-card::after { content: ""; position: absolute; width: 82px; height: 82px; border-radius: 50%; right: -38px; bottom: -38px; background: currentColor; opacity: .07; }
    .external-card.shop { color: var(--orange); background: linear-gradient(145deg,#fff,#fff7ef); }
    .external-card.store { color: var(--aqua); background: linear-gradient(145deg,#fff,#f0fbf8); }
    .external-card svg { width: 23px; height: 23px; }
    .external-card strong { display: block; color: var(--ink); font-size: 13px; margin-top: 9px; }
    .external-card span { display: block; color: var(--muted); font-size: 9px; margin-top: 4px; }
    .external-badge { position: absolute; right: 9px; top: 9px; padding: 3px 6px; border-radius: 7px; background: rgba(255,255,255,.78); color: var(--muted); font-size: 8px; }

    .device-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 13px; }
    .summary-cell { padding: 13px; }
    .summary-cell span { color: var(--muted); font-size: 10px; }
    .summary-cell strong { display: block; margin-top: 5px; font-size: 17px; }
    .summary-cell small { display: block; color: var(--success); font-size: 9px; margin-top: 3px; }

    .device-card { overflow: hidden; margin-bottom: 12px; }
    .device-card-main { display: flex; gap: 13px; padding: 15px; cursor: pointer; }
    .device-visual { position: relative; width: 105px; height: 116px; flex: 0 0 105px; display: grid; place-items: center; overflow: hidden; border-radius: 17px; background: linear-gradient(145deg,#edf4ff,#dae9ff); }
    .device-visual.bracelet { background: linear-gradient(145deg,#f1efff,#e4e0ff); }
    .device-visual.ring { background: linear-gradient(145deg,#e7f7f3,#d5f0ea); }
    .cabin-art { position: relative; width: 56px; height: 85px; border-radius: 28px 28px 13px 13px; background: linear-gradient(90deg,#fefefe,#cbd9ef); box-shadow: 8px 9px 17px rgba(64,91,137,.2); }
    .cabin-art::before { content: ""; position: absolute; width: 36px; height: 38px; left: 10px; top: 10px; border-radius: 20px 20px 10px 10px; background: linear-gradient(145deg,#76b3ec,#346eb5); box-shadow: inset 4px 4px 8px rgba(255,255,255,.35); }
    .cabin-art::after { content: "T"; position: absolute; bottom: 11px; left: 0; right: 0; text-align: center; color: #52709a; font-size: 12px; font-weight: 800; }
    .watch-art { width: 40px; height: 62px; position: relative; border: 7px solid #45465c; border-radius: 16px; background: linear-gradient(145deg,#22263b,#5260a2); box-shadow: 0 -25px 0 -16px #8f92af, 0 25px 0 -16px #8f92af, 8px 11px 18px rgba(73,72,131,.25); }
    .watch-art::before { content: "♥"; position: absolute; inset: 0; display: grid; place-items: center; color: #ff8093; font-size: 13px; }
    .ring-art { position: relative; width: 48px; height: 48px; border: 9px solid #35b7a1; border-radius: 50%; background: linear-gradient(145deg,#f3fbf9,#cde9e2); box-shadow: inset -3px -4px 7px rgba(24,130,112,.15), 9px 11px 18px rgba(38,153,133,.22); }
    .ring-art::before { content: ""; position: absolute; left: 50%; top: -13px; transform: translateX(-50%); width: 16px; height: 13px; border-radius: 6px 6px 4px 4px; background: linear-gradient(145deg,#8fe6d5,#35b8a2); box-shadow: 0 2px 4px rgba(28,140,120,.35); }
    .ring-art::after { content: "♥"; position: absolute; inset: 0; display: grid; place-items: center; color: #35b7a1; font-size: 12px; }
    .online-dot { position: absolute; top: 9px; left: 9px; display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; color: var(--success); background: rgba(255,255,255,.8); font-size: 8px; font-weight: 700; }
    .online-dot i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .device-info { flex: 1; min-width: 0; }
    .device-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 7px; }
    .device-title strong { font-size: 14px; }
    .device-title span { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .device-meta { display: grid; gap: 7px; margin-top: 15px; }
    .device-meta div { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .device-meta b { color: var(--text); font-weight: 650; }
    .device-card-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
    .device-card-actions button { padding: 11px; border: 0; background: #fff; color: var(--brand); font-size: 11px; cursor: pointer; }
    .device-card-actions button + button { border-left: 1px solid var(--line); }

    .empty-add { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border: 1px dashed #cfd8e8; border-radius: 15px; color: var(--brand); background: rgba(255,255,255,.5); cursor: pointer; font-size: 11px; }

    .record-detail-hero { position: relative; overflow: hidden; padding: 17px; color: #fff; border-radius: 22px; background: linear-gradient(140deg,#1e66e9,#2c81ed 55%,#27aea9); box-shadow: 0 14px 30px rgba(34,105,215,.22); }
    .record-detail-hero::after { content: ""; position: absolute; width: 150px; height: 150px; right: -55px; bottom: -82px; border-radius: 50%; border: 24px solid rgba(255,255,255,.07); }
    .record-detail-meta { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; color: rgba(255,255,255,.72); font-size: 9px; }
    .record-detail-main { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
    .record-detail-copy { flex: 1; min-width: 0; }
    .record-detail-copy strong { display: block; font-size: 16px; }
    .record-detail-copy p { margin: 5px 0 0; color: rgba(255,255,255,.76); font-size: 10px; }
    .record-detail-mode { flex: 0 0 auto; padding: 6px 9px; border-radius: 9px; color: #dffaf3; background: rgba(255,255,255,.13); font-size: 9px; line-height: 1.5; text-align: center; }
    .record-detail-stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4,1fr); margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.17); }
    .record-detail-stats div { text-align: center; }
    .record-detail-stats span { display: block; color: rgba(255,255,255,.66); font-size: 8px; }
    .record-detail-stats strong { display: block; margin-top: 4px; font-size: 13px; }
    .sensor-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
    .sensor-cell { padding: 13px 11px; }
    .sensor-cell span { display: block; color: var(--muted); font-size: 10px; }
    .sensor-cell strong { display: block; margin-top: 7px; font-size: 18px; letter-spacing: -.02em; }
    .sensor-cell em { display: block; color: var(--muted); font-style: normal; font-size: 9px; margin-top: 3px; }
    .primary-action { width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 13px; padding: 13px; border: 0; border-radius: 15px; color: #fff; background: linear-gradient(135deg,var(--brand),#3187ee); box-shadow: 0 10px 20px rgba(39,110,241,.2); cursor: pointer; font-size: 13px; font-weight: 700; }
    .primary-action svg { width: 18px; height: 18px; }

    .health-score-card { display: flex; align-items: center; gap: 16px; padding: 16px; }
    .mini-score { --score: 86%; position: relative; width: 88px; height: 88px; flex: 0 0 88px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--aqua) var(--score), #e9eef4 0); }
    .mini-score::before { content: ""; position: absolute; width: 70px; height: 70px; border-radius: 50%; background: #fff; }
    .mini-score div { position: relative; z-index: 1; text-align: center; }
    .mini-score strong { display: block; font-size: 24px; }
    .mini-score span { color: var(--muted); font-size: 8px; }
    .health-score-copy strong { font-size: 14px; }
    .health-score-copy p { margin: 6px 0 9px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .status-tag { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 9px; color: var(--success); background: var(--aqua-soft); font-size: 9px; }
    .status-tag i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .period-tabs { display: grid; grid-template-columns: repeat(3,1fr); padding: 3px; margin: 13px 0; border-radius: 13px; background: #e9eef5; }
    .period-tabs button { padding: 8px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; font-size: 10px; cursor: pointer; }
    .period-tabs button.active { color: var(--brand); background: #fff; font-weight: 700; box-shadow: 0 3px 9px rgba(42,65,106,.07); }
    .chart-card { padding: 14px; }
    .chart-title { display: flex; align-items: start; justify-content: space-between; }
    .chart-title span { color: var(--muted); font-size: 10px; }
    .chart-title strong { display: block; margin-top: 4px; font-size: 22px; }
    .chart-title strong small { color: var(--muted); font-size: 10px; font-weight: 500; }
    .trend-up { color: var(--success); font-size: 9px; }
    .line-chart { width: 100%; height: 116px; margin-top: 10px; overflow: visible; }
    .line-chart text { fill: #98a3b5; font-size: 8px; }
    .line-chart .grid { stroke: #edf1f6; stroke-width: 1; }
    .line-chart .area { fill: url(#healthArea); }
    .line-chart .path { fill: none; stroke: var(--brand); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .line-chart .dot { fill: #fff; stroke: var(--brand); stroke-width: 2; }

    .health-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .health-metric { padding: 13px; }
    .health-metric-head { display: flex; align-items: center; justify-content: space-between; }
    .health-metric-head span { color: var(--muted); font-size: 10px; }
    .health-metric-head svg { width: 16px; height: 16px; }
    .health-metric strong { display: inline-block; margin-top: 8px; font-size: 19px; }
    .health-metric em { color: var(--muted); font-style: normal; font-size: 9px; }

      visibility: hidden;

    function cabinTrendChart(data) {
      const w = 330, h = 128, pad = 16;
      const min = Math.min(...data.points) - 0.8;
      const max = Math.max(...data.points) + 0.8;
      const coords = data.points.map((v, i) => [pad + i * (w - pad * 2) / (data.points.length - 1), 16 + (max - v) * (h - 40) / (max - min)]);
      const path = coords.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      const area = `${path} L${coords[coords.length - 1][0].toFixed(1)},${h - 18} L${coords[0][0].toFixed(1)},${h - 18} Z`;
      const grid = [0, .5, 1].map((v, i) => { const y = 16 + i * (h - 40) / 2; return `<line class="grid" x1="${pad}" x2="${w - pad}" y1="${y}" y2="${y}"/>`; }).join('');
      const dots = coords.map((p, i) => `<circle class="dot" style="stroke:#1fb7a6" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === coords.length - 1 ? 4 : 2.6}"/>`).join('');
      return `<svg class="line-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="${data.label}趋势"><defs><linearGradient id="cabinArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb7a6" stop-opacity=".2"/><stop offset="1" stop-color="#1fb7a6" stop-opacity="0"/></linearGradient></defs>${grid}<path class="area" style="fill:url(#cabinArea)" d="${area}"/><path class="path" style="stroke:#1fb7a6" d="${path}"/>${dots}</svg>`;

    ];

    const multiModalReports = [
      { id:0, date:'8月18日', time:'09:30', score:82, status:'已完成', summary:'整体状态良好，共分析 24 项指标，较上次检测提升 4 分。' },
      { id:1, date:'8月04日', time:'15:10', score:78, status:'已完成', summary:'心肺功能平稳，睡眠质量小幅改善。' },
      { id:2, date:'7月20日', time:'10:05', score:75, status:'已完成', summary:'基础指标正常，压力状态轻度偏高。' }

    const reportSections = {
      cardio: { title:'心肺功能', level:'状态良好', items:[['静息心率',82, '72 bpm'],['血氧水平',92,'98%'],['心率变异性',76,'48 ms'],['呼吸频率',85,'16 次/分']], advice:'心肺相关指标整体处于良好水平。建议保持每周3—4次舒缓氧疗，并结合适量有氧运动。' },

      stress: { title:'压力状态', level:'状态平稳', items:[['压力指数',72,'正常'],['恢复能力',79,'良好'],['自主神经',75,'平衡'],['疲劳水平',68,'轻度']], advice:'近期压力状态基本平稳，存在轻度疲劳。建议保证规律作息，并适当降低高强度活动。' },
      body: { title:'身体机能', level:'综合良好', items:[['身体活力',83,'良好'],['代谢状态',74,'正常'],['运动恢复',79,'良好'],['综合机能',81,'良好']], advice:'综合机能表现良好。持续记录氧疗和日常健康数据，有助于获得更准确的长期趋势。' }
    };

    function reportPage() {
      return `<div class="section-head first"><h2>多模态检测报告</h2><span>共 ${multiModalReports.length} 份</span></div><div class="report-list">${multiModalReports.map(r=>{ const idx = multiModalReports.indexOf(r); return `<div class="report-list-card card" data-action="open-report" data-id="${idx}"><div class="report-list-gauge" style="background:conic-gradient(var(--purple) 0 ${r.score}%, #ececf6 ${r.score}%)"><div><strong>${r.score}</strong><span>综合评估</span></div></div><div class="report-list-copy"><strong>${r.date}</strong><span>${r.time} · ${r.status}</span><p>${r.summary}</p></div>${icon('chevron',15)}</div>`; }).join('')}</div>`;
    }

    function reportDetailPage() {
      const r = multiModalReports[state.selectedReport] || multiModalReports[0];
      const s = reportSections[state.reportSection];
      return `<div class="report-hero"><div class="report-meta"><span>${r.date} ${r.time} · 多模态综合检测</span><span class="report-badge">${r.status}</span></div><div class="report-main"><div class="report-gauge" style="background:conic-gradient(#89efd1 0 ${r.score}%, rgba(255,255,255,.16) ${r.score}%)"><div><strong>${r.score}</strong><span>综合评估</span></div></div><div class="report-copy"><strong>整体状态良好</strong><p>${r.summary}</p></div></div></div><div class="report-tabs">${[['cardio','心肺功能'],['sleep','睡眠状态'],['stress','压力状态'],['body','身体机能']].map(x=>`<button class="${state.reportSection===x[0]?'active':''}" data-action="report-tab" data-section="${x[0]}">${x[1]}</button>`).join('')}</div><div class="report-section card"><div class="report-section-head"><strong>${s.title}指标</strong><span class="level-good">● ${s.level}</span></div><div class="indicator-list">${s.items.map(i=>`<div class="indicator-row"><span>${i[0]}</span><div class="indicator-bar"><i style="width:${i[1]}%"></i></div><strong>${i[2]}</strong></div>`).join('')}</div></div><div class="report-advice">${icon('sparkles')}<div><strong>健康建议</strong><br>${s.advice}</div></div><button class="primary-action" data-action="toast" data-message="报告分享卡片已生成">${icon('link')} 分享检测报告</button>`;
    }

    function tonguePage() {
      return `<div class="section-head first"><h2>舌诊报告</h2><span>共 ${tongueRecords.length} 份</span></div><div class="record-list">${tongueRecords.map(r=>{ const idx = tongueRecords.indexOf(r); return `<div class="record-card card" data-action="open-tongue" data-id="${idx}"><div class="record-top"><div class="record-date"><div><strong>${r.day}</strong><span>${r.month}</span></div></div><div class="record-copy"><strong>${r.constitution} · 综合评分 ${r.score}</strong><span>${r.date} ${r.time}</span></div><span class="record-type">${r.source}</span>${icon('chevron',14)}</div><div class="record-bottom"><div><span>舌色</span><strong>${r.body[0][1]}</strong></div><div><span>舌形</span><strong>${r.body[1][1]}</strong></div><div><span>苔色</span><strong>${r.coating[0][1]}</strong></div></div></div>`; }).join('')}</div>`;
    }

    function tongueDetailPage() {
      const r = tongueRecords[state.selectedTongue] || tongueRecords[0];
      const cell = items => items.map(i => `<div class="tongue-cell card"><span>${i[0]}</span><strong>${i[1]}</strong>${i[2] ? `<em>${i[2]}</em>` : ''}</div>`).join('');
      return `<div class="tongue-hero"><div class="report-meta"><span>${r.date} ${r.time} · ${r.source}</span><span class="report-badge">已完成</span></div><div class="report-main"><div class="tongue-score"><div><strong>${r.score}</strong><span>综合评分</span></div></div><div class="report-copy"><strong>${r.constitution}</strong><p>${r.summary}</p></div></div></div><div class="section-head" style="margin-top:18px"><h2>舌质</h2><span>舌色 · 舌形 · 舌态</span></div><div class="tongue-grid">${cell(r.body)}</div><div class="section-head" style="margin-top:18px"><h2>舌苔</h2><span>苔色 · 苔质</span></div><div class="tongue-grid">${cell(r.coating)}</div><div class="report-advice">${icon('sparkles')}<div><strong>健康建议</strong><br>${r.advice}</div></div><button class="primary-action" data-action="toast" data-message="舌诊报告分享卡片已生成">${icon('link')} 分享舌诊报告</button>`;
    }

    function profilePage() {
      return `<div class="profile-card"><div class="profile-glow profile-glow-a"></div><div class="profile-glow profile-glow-b"></div><div class="profile-top"><div class="profile-avatar">林</div><div class="profile-copy"><div class="profile-name-row"><strong>林女士</strong></div><span class="profile-sub">泰瑞之家 · 尊享氧健康服务</span></div><button class="profile-setting-btn" data-action="toast" data-message="设置中心已打开" aria-label="设置">${icon('settings',18)}</button></div></div><div class="profile-group"><div class="profile-group-title">健康与设备</div><div class="profile-menu card"><button class="profile-menu-row" data-action="go" data-page="devices"><span class="profile-menu-icon" style="color:var(--brand);background:linear-gradient(145deg,#eaf1ff,#d7e6ff)">${icon('device')}</span><span class="profile-menu-copy"><strong>我的设备</strong><small>查看已绑定的健康硬件</small></span><span class="profile-menu-badge">3 台</span>${icon('chevron',16)}</button><button class="profile-menu-row" data-action="go" data-page="checkin"><span class="profile-menu-icon" style="color:var(--success);background:linear-gradient(145deg,#e7f8f5,#d2f0ea)">${icon('activity')}</span><span class="profile-menu-copy"><strong>每日四维打卡</strong><small>吸氧 · 饮食 · 练习 · 睡眠</small></span><span class="profile-menu-badge" style="color:var(--success);background:var(--aqua-soft)">今日 3/4</span>${icon('chevron',16)}</button></div></div><div class="profile-group"><div class="profile-group-title">健康报告</div><div class="profile-menu card"><button class="profile-menu-row" data-action="go" data-page="tongue"><span class="profile-menu-icon" style="color:var(--orange);background:linear-gradient(145deg,#fff2e8,#ffe4d1)">${icon('tongue')}</span><span class="profile-menu-copy"><strong>舌诊报告</strong><small>AI 舌象与体质分析</small></span><span class="profile-menu-badge" style="color:var(--orange);background:var(--orange-soft)">2 份</span>${icon('chevron',16)}</button><button class="profile-menu-row" data-action="go" data-page="report"><span class="profile-menu-icon" style="color:var(--purple);background:linear-gradient(145deg,#f0edff,#e5dfff)">${icon('report')}</span><span class="profile-menu-copy"><strong>检测报告</strong><small>多模态健康检测</small></span><span class="profile-menu-badge" style="color:var(--purple);background:var(--purple-soft)">3 份</span>${icon('chevron',16)}</button><button class="profile-menu-row" data-action="go" data-page="records"><span class="profile-menu-icon" style="color:var(--aqua);background:linear-gradient(145deg,#e7f8f5,#d4efe9)">${icon('oxygen')}</span><span class="profile-menu-copy"><strong>氧舱记录</strong><small>氧疗历史与数据</small></span><span class="profile-menu-badge" style="color:var(--aqua);background:var(--aqua-soft)">36 次</span>${icon('chevron',16)}</button></div></div>`;
    }

    function ordersPage() {
      return `<div class="sync-banner">${icon('sync')}以下订单和预约数据同步自客户原有商城系统，交易及售后操作将跳转至原小程序办理。</div><div class="filter-row"><button class="active">全部</button><button>商城订单</button><button>服务预约</button></div><div class="order-card card"><div class="order-store"><strong>泰瑞医疗官方商城</strong><span>待收货</span></div><div class="order-product"><div class="order-product-art">${icon('watch')}</div><div class="order-product-copy"><strong>泰瑞健康手环 S2</strong><span>星空灰 · 标准款 ×1</span><b>¥ 699.00</b></div></div><div class="order-actions"><button class="outline-btn" data-action="external" data-target="查看物流">查看物流</button><button class="outline-btn primary" data-action="external" data-target="订单详情">订单详情</button></div></div><div class="order-card card"><div class="order-store"><strong>泰瑞氧疗中心（滨江店）</strong><span style="color:var(--aqua)">待服务</span></div><div class="order-product"><div class="order-product-art" style="color:var(--aqua);background:var(--aqua-soft)">${icon('oxygen')}</div><div class="order-product-copy"><strong>专业舒缓氧疗 · 单次</strong><span>预约时间：8月22日 14:30</span><b>¥ 168.00</b></div></div><div class="order-actions"><button class="outline-btn" data-action="external" data-target="门店导航">门店导航</button><button class="outline-btn primary" data-action="external" data-target="预约详情">查看预约</button></div></div><div class="order-card card"><div class="order-store"><strong>泰瑞医疗官方商城</strong><span style="color:var(--muted)">已完成</span></div><div class="order-product"><div class="order-product-art">${icon('box')}</div><div class="order-product-copy"><strong>氧舱专用清洁护理套装</strong><span>标准套装 ×1</span><b>¥ 128.00</b></div></div><div class="order-actions"><button class="outline-btn" data-action="external" data-target="再次购买">再次购买</button><button class="outline-btn primary" data-action="external" data-target="订单详情">订单详情</button></div></div>`;
    }

    const pageRenderers = { home: homePage, devices: devicesPage, health: healthPage, checkin: checkinPage, 'checkin-history': checkinHistoryPage, assistant: assistantPage, records: recordsPage, 'record-detail': recordDetailPage, report: reportPage, 'report-detail': reportDetailPage, tongue: tonguePage, 'tongue-detail': tongueDetailPage, orders: ordersPage, profile: profilePage };
    const pageTitles = { devices:'设备中心', health:'健康中心', checkin:'客户行为及生活方式监管', 'checkin-history':'打卡历史记录', assistant:'AI助手', records:'氧舱记录', 'record-detail':'氧舱记录详情', report:'多模态检测报告', 'report-detail':'多模态检测报告', tongue:'舌诊报告', 'tongue-detail':'舌诊报告详情', orders:'商城与预约', profile:'个人中心' };

    function render() {
      const isTab = tabPages.some(t => t.id === state.page);
      document.getElementById('appbar').innerHTML = isTab ? header(pageTitles[state.page], false) : header(pageTitles[state.page]);
      document.getElementById('screen').innerHTML = pageRenderers[state.page]();
      const screen = document.getElementById('screen');
      screen.scrollTop = state.page === 'assistant' ? screen.scrollHeight : 0;
      const tabbar = document.getElementById('tabbar');
      tabbar.style.display = isTab ? '' : 'none';
      tabbar.innerHTML = tabPages.map(t => `<button class="${state.page===t.id?'active':''}" data-action="go" data-page="${t.id}">${icon(t.icon)}<span>${t.label}</span></button>`).join('');
    }

    function navigate(page) {
      if (!pageRenderers[page]) return;
      if (state.page === page) return;
      state.history.push(page);
      state.page = page;
      render();
    }

    function goBack() {
      if (state.history.length > 1) {
        state.history.pop();
        state.page = state.history[state.history.length - 1];
      } else {
        state.page = 'home';
      }
      render();
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function openModal({ title, text, confirm='确认', action='generic', iconName='info' }) {
      state.modalAction = action;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').textContent = text;
      document.getElementById('modalConfirm').textContent = confirm;
      document.getElementById('modalIcon').innerHTML = icon(iconName);
      document.getElementById('modalLayer').classList.add('show');
    }

    function closeModal() { document.getElementById('modalLayer').classList.remove('show'); state.modalAction = null; }

    function confirmModalAction() {
      const action = state.modalAction;
      closeModal();
      if (action === 'external') {
        showToast('正在打开客户原商城小程序…');
      } else if (action === 'bind') {
        showToast('已打开扫码绑定');
      }
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'go') navigate(target.dataset.page);
      if (action === 'back') goBack();
      if (action === 'toast') showToast(target.dataset.message || '功能已触发');
      if (action === 'period') { state.healthPeriod = target.dataset.period; render(); }
      if (action === 'record-filter') { state.recordFilter = target.dataset.filter; render(); }
      if (action === 'report-tab') { state.reportSection = target.dataset.section; render(); }
      if (action === 'open-checkin') { state.checkinType = target.dataset.type || 'oxygen'; navigate('checkin'); }
      if (action === 'select-checkin') { state.checkinType = target.dataset.type; render(); }
      if (action === 'checkin-source') { state.checkinSource = target.dataset.source; render(); }
      if (action === 'import-checkin') showToast('已从关联设备读取最新数据');
      if (action === 'save-checkin') {
        state.dailyChecks[state.checkinType] = true;
        render();
        showToast('今日打卡已保存');
      }
      if (action === 'ai-quick') askAi(target.dataset.prompt);
      if (action === 'ai-send') {
        const input = document.getElementById('aiInput');
        askAi(input ? input.value : '');
      }
      if (action === 'open-record') { state.selectedRecord = Number(target.dataset.id) || 0; state.trendMetric = 'oxygen'; navigate('record-detail'); }
      if (action === 'open-report') { state.selectedReport = Number(target.dataset.id) || 0; state.reportSection = 'cardio'; navigate('report-detail'); }
      if (action === 'open-tongue') { state.selectedTongue = Number(target.dataset.id) || 0; navigate('tongue-detail'); }
      if (action === 'trend-tab') { state.trendMetric = target.dataset.metric; render(); }
      if (action === 'external') openModal({title:`前往${target.dataset.target || '原商城'}`,text:'该业务由客户原有商城小程序提供，泰瑞之家小程序将携带当前用户身份跳转办理。',confirm:'继续前往',action:'external',iconName:'link'});
      if (action === 'bind-device') openModal({title:'绑定新设备',text:'请扫描氧舱、手环或泰瑞健康戒指机身二维码，完成设备验证与绑定。',confirm:'开始扫码',action:'bind',iconName:'device'});
      if (action === 'sync') {
        const svg = target.querySelector('svg');
        if (svg) svg.classList.add('spin');
        target.disabled = true;
        setTimeout(() => { showToast('手环数据同步完成'); if (state.page==='devices' || state.page==='health') render(); }, 900);
      }
      if (action === 'modal-cancel') closeModal();
      if (action === 'modal-confirm') confirmModalAction();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && event.target && event.target.id === 'aiInput') {
        event.preventDefault();
        askAi(event.target.value);
      }
    });

    const now = new Date();
    document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    render();
  </script>
</body>
</html>
