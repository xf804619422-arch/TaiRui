<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>泰瑞医疗 C端小程序原型</title>
  <style>
    :root {
      --brand: #276ef1;
      --brand-deep: #1554c4;
      --brand-soft: #eaf1ff;
      --aqua: #1fb7a6;
      --aqua-soft: #e7f8f5;
      --orange: #ff9b51;
      --orange-soft: #fff2e8;
      --purple: #7c6cf2;
      --purple-soft: #f0edff;
      --ink: #17243f;
      --text: #46536c;
      --muted: #8a96ab;
      --line: #e8edf5;
      --surface: #ffffff;
      --canvas: #f3f6fb;
      --success: #19a974;
      --danger: #ed5b65;
      --shadow: 0 14px 40px rgba(35, 64, 120, .12);
      --phone-w: 390px;
      --phone-h: 844px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 13% 13%, rgba(39, 110, 241, .13), transparent 28%),
        radial-gradient(circle at 86% 84%, rgba(31, 183, 166, .12), transparent 26%),
        #eef3fa;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .prototype-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 244px minmax(450px, 1fr);
      gap: 26px;
      align-items: center;
      max-width: 940px;
      margin: 0 auto;
      padding: 32px;
    }

    .demo-panel {
      align-self: stretch;
      max-height: calc(100vh - 64px);
      overflow: auto;
      padding: 10px 2px;
      scrollbar-width: none;
    }

    .demo-panel::-webkit-scrollbar { display: none; }

    .demo-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(145deg, var(--brand), #34b7c9);
      box-shadow: 0 10px 24px rgba(39, 110, 241, .24);
    }

    .brand-mark svg { width: 25px; height: 25px; }
    .demo-brand strong { display: block; font-size: 17px; font-weight: 700; }
    .demo-brand span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }

    .panel-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      margin: 20px 12px 9px;
      text-transform: uppercase;
    }

    .screen-menu { display: grid; gap: 6px; }

    .screen-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 13px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: .2s ease;
    }

    .screen-menu button:hover { background: rgba(255,255,255,.7); }

    .screen-menu button.active {
      color: var(--brand);
      background: #fff;
      box-shadow: 0 7px 20px rgba(39, 75, 140, .08);
      font-weight: 700;
    }

    .menu-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: currentColor;
      background: rgba(255,255,255,.66);
    }

    .screen-menu button.active .menu-icon { background: var(--brand-soft); }
    .menu-icon svg { width: 17px; height: 17px; }

    .stage { display: grid; place-items: center; min-width: 0; }

    .phone {
      position: relative;
      width: var(--phone-w);
      height: min(var(--phone-h), calc(100vh - 42px));
      min-height: 680px;
      overflow: hidden;
      border: 8px solid #101827;
      border-radius: 48px;
      background: var(--canvas);
      box-shadow: 0 30px 80px rgba(24, 46, 87, .26), inset 0 0 0 1px rgba(255,255,255,.15);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 20;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 25px;
      border-radius: 18px;
      background: #101827;
      pointer-events: none;
    }

    .phone-inner { height: 100%; display: flex; flex-direction: column; }

    .statusbar {
      position: relative;
      z-index: 5;
      height: 38px;
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 19px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      background: rgba(255,255,255,.93);
    }

    .status-icons { display: flex; align-items: center; gap: 5px; }
    .signal { display: flex; align-items: end; gap: 2px; height: 10px; }
    .signal i { display: block; width: 2px; border-radius: 1px; background: currentColor; }
    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }
    .battery { width: 20px; height: 10px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; position: relative; }
    .battery::before { content: ""; display: block; width: 85%; height: 100%; border-radius: 1px; background: currentColor; }
    .battery::after { content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: currentColor; }

    .appbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px 10px;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid rgba(228, 234, 244, .75);
    }

    .appbar-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .appbar-logo { width: 31px; height: 31px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, var(--brand), #25b1c1); }
    .appbar-logo svg { width: 18px; height: 18px; }
    .appbar-copy strong { display: block; font-size: 16px; font-weight: 750; }
    .appbar-copy span { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }

    .back-btn, .circle-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #f5f7fb;
      cursor: pointer;
    }

    .back-btn:hover, .circle-btn:hover { background: var(--brand-soft); color: var(--brand); }

    .appbar-heading {
      flex: 1;
      font-size: 16px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-capsule {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: #28344b;
      background: rgba(255,255,255,.85);
    }

    .mini-capsule i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; box-shadow: 7px 0 0 currentColor, -7px 0 0 currentColor; }
    .mini-capsule b { width: 1px; height: 15px; background: var(--line); }
    .mini-capsule span { width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 50%; }

    .screen {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 14px 14px 24px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar { display: none; }

    .tabbar {
      position: relative;
      z-index: 8;
      height: 68px;
      flex: 0 0 68px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 5px 8px 7px;
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -7px 20px rgba(41, 61, 99, .04);
    }

    .tabbar button {
      border: 0;
      background: transparent;
      display: grid;
      justify-items: center;
      gap: 3px;
      color: #9aa4b5;
      font-size: 10px;
      cursor: pointer;
    }

    .tabbar button svg { width: 22px; height: 22px; }
    .tabbar button.active { color: var(--brand); font-weight: 700; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 2px 10px;
    }

    .section-head.first { margin-top: 2px; }
    .section-head h2 { margin: 0; font-size: 16px; font-weight: 750; }
    .section-head span { color: var(--muted); font-size: 11px; }
    .text-link { border: 0; padding: 4px 0; color: var(--brand); background: transparent; font-size: 12px; cursor: pointer; }

    .card {
      border: 1px solid rgba(230,235,244,.9);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 6px 20px rgba(50, 76, 124, .055);
    }

    .greeting { display: flex; align-items: center; justify-content: space-between; margin: 1px 2px 14px; }
    .greeting h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    .greeting p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .avatar { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; color: #fff; font-weight: 700; background: linear-gradient(145deg,#94aaf6,#6f67da); box-shadow: 0 8px 16px rgba(105, 102, 217, .2); }

    .hero-health {
      position: relative;
      overflow: hidden;
      min-height: 172px;
      padding: 18px;
      color: #fff;
      border-radius: 22px;
      background: linear-gradient(135deg, #1e66e9 0%, #2c81ed 48%, #27aea9 120%);
      box-shadow: 0 15px 30px rgba(34, 105, 215, .22);
    }

    .hero-health::before, .hero-health::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.09); }
    .hero-health::before { width: 155px; height: 155px; right: -55px; top: -72px; }
    .hero-health::after { width: 96px; height: 96px; right: 67px; bottom: -62px; }
    .hero-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
    .hero-kicker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.83); }
    .hero-kicker i { width: 7px; height: 7px; border-radius: 50%; background: #84f1d1; box-shadow: 0 0 0 4px rgba(132,241,209,.15); }
    .hero-date { font-size: 11px; color: rgba(255,255,255,.72); }
    .hero-body { position: relative; z-index: 1; display: flex; align-items: center; gap: 18px; margin-top: 16px; }
    .score-ring { position: relative; width: 91px; height: 91px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(#8cf0d6 0 86%, rgba(255,255,255,.18) 86%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
    .score-ring::before { content: ""; position: absolute; width: 72px; height: 72px; border-radius: 50%; background: #2b78e7; }
    .score-value { position: relative; z-index: 1; text-align: center; }
    .score-value strong { display: block; font-size: 27px; line-height: 1; }
    .score-value span { font-size: 9px; color: rgba(255,255,255,.78); }
    .hero-summary { flex: 1; }
    .hero-summary strong { display: block; font-size: 16px; }
    .hero-summary p { margin: 6px 0 12px; font-size: 11px; line-height: 1.55; color: rgba(255,255,255,.78); }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .hero-tag { padding: 5px 8px; border-radius: 10px; background: rgba(255,255,255,.14); font-size: 9px; }

    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .quick-item { border: 0; padding: 11px 3px 8px; border-radius: 15px; background: #fff; cursor: pointer; }
    .quick-icon { width: 38px; height: 38px; display: grid; place-items: center; margin: 0 auto 7px; border-radius: 13px; }
    .quick-icon svg { width: 20px; height: 20px; }
    .quick-item span { display: block; font-size: 10px; color: var(--text); }
    .quick-item:nth-child(1) .quick-icon { color: var(--brand); background: var(--brand-soft); }
    .quick-item:nth-child(2) .quick-icon { color: var(--aqua); background: var(--aqua-soft); }
    .quick-item:nth-child(3) .quick-icon { color: var(--purple); background: var(--purple-soft); }
    .quick-item:nth-child(4) .quick-icon { color: var(--orange); background: var(--orange-soft); }

    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric-card { padding: 12px 11px; }
    .metric-card .metric-label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
    .metric-card .metric-label svg { width: 13px; height: 13px; }
    .metric-card strong { display: inline-block; margin-top: 8px; font-size: 18px; }
    .metric-card em { color: var(--muted); font-size: 9px; font-style: normal; margin-left: 2px; }
    .metric-card small { display: block; color: var(--success); font-size: 9px; margin-top: 4px; }

    .session-card { padding: 14px; cursor: pointer; }
    .session-main { display: flex; align-items: center; gap: 12px; }
    .session-icon { width: 46px; height: 46px; flex: 0 0 46px; display: grid; place-items: center; color: var(--brand); border-radius: 15px; background: var(--brand-soft); }
    .session-icon svg { width: 24px; height: 24px; }
    .session-copy { min-width: 0; flex: 1; }
    .session-copy strong { display: block; font-size: 13px; }
    .session-copy span { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
    .session-result { display: flex; align-items: center; gap: 8px; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
    .result-point { flex: 1; }
    .result-point span { color: var(--muted); font-size: 9px; }
    .result-point strong { display: block; margin-top: 2px; font-size: 13px; }
    .result-arrow { color: var(--success); font-weight: 800; }
    .positive { color: var(--success); }

    .external-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .external-card { position: relative; overflow: hidden; padding: 14px; min-height: 110px; border: 0; text-align: left; cursor: pointer; }
    .external-card::after { content: ""; position: absolute; width: 82px; height: 82px; border-radius: 50%; right: -38px; bottom: -38px; background: currentColor; opacity: .07; }
    .external-card.shop { color: var(--orange); background: linear-gradient(145deg,#fff,#fff7ef); }
    .external-card.store { color: var(--aqua); background: linear-gradient(145deg,#fff,#f0fbf8); }
    .external-card svg { width: 23px; height: 23px; }
    .external-card strong { display: block; color: var(--ink); font-size: 13px; margin-top: 9px; }
    .external-card span { display: block; color: var(--muted); font-size: 9px; margin-top: 4px; }
    .external-badge { position: absolute; right: 9px; top: 9px; padding: 3px 6px; border-radius: 7px; background: rgba(255,255,255,.78); color: var(--muted); font-size: 8px; }

    .device-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 13px; }
    .summary-cell { padding: 13px; }
    .summary-cell span { color: var(--muted); font-size: 10px; }
    .summary-cell strong { display: block; margin-top: 5px; font-size: 17px; }
    .summary-cell small { display: block; color: var(--success); font-size: 9px; margin-top: 3px; }

    .device-card { overflow: hidden; margin-bottom: 12px; }
    .device-card-main { display: flex; gap: 13px; padding: 15px; cursor: pointer; }
    .device-visual { position: relative; width: 105px; height: 116px; flex: 0 0 105px; display: grid; place-items: center; overflow: hidden; border-radius: 17px; background: linear-gradient(145deg,#edf4ff,#dae9ff); }
    .device-visual.bracelet { background: linear-gradient(145deg,#f1efff,#e4e0ff); }
    .cabin-art { position: relative; width: 56px; height: 85px; border-radius: 28px 28px 13px 13px; background: linear-gradient(90deg,#fefefe,#cbd9ef); box-shadow: 8px 9px 17px rgba(64,91,137,.2); }
    .cabin-art::before { content: ""; position: absolute; width: 36px; height: 38px; left: 10px; top: 10px; border-radius: 20px 20px 10px 10px; background: linear-gradient(145deg,#76b3ec,#346eb5); box-shadow: inset 4px 4px 8px rgba(255,255,255,.35); }
    .cabin-art::after { content: "T"; position: absolute; bottom: 11px; left: 0; right: 0; text-align: center; color: #52709a; font-size: 12px; font-weight: 800; }
    .watch-art { width: 40px; height: 62px; position: relative; border: 7px solid #45465c; border-radius: 16px; background: linear-gradient(145deg,#22263b,#5260a2); box-shadow: 0 -25px 0 -16px #8f92af, 0 25px 0 -16px #8f92af, 8px 11px 18px rgba(73,72,131,.25); }
    .watch-art::before { content: "♥"; position: absolute; inset: 0; display: grid; place-items: center; color: #ff8093; font-size: 13px; }
    .online-dot { position: absolute; top: 9px; left: 9px; display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; color: var(--success); background: rgba(255,255,255,.8); font-size: 8px; font-weight: 700; }
    .online-dot i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .device-info { flex: 1; min-width: 0; }
    .device-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 7px; }
    .device-title strong { font-size: 14px; }
    .device-title span { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .device-meta { display: grid; gap: 7px; margin-top: 15px; }
    .device-meta div { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .device-meta b { color: var(--text); font-weight: 650; }
    .device-card-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
    .device-card-actions button { padding: 11px; border: 0; background: #fff; color: var(--brand); font-size: 11px; cursor: pointer; }
    .device-card-actions button + button { border-left: 1px solid var(--line); }

    .empty-add { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border: 1px dashed #cfd8e8; border-radius: 15px; color: var(--brand); background: rgba(255,255,255,.5); cursor: pointer; font-size: 11px; }

    .control-hero { position: relative; overflow: hidden; padding: 17px; color: #fff; border-radius: 24px; background: linear-gradient(155deg,#195bcc,#2d86ec 54%,#24aaa4); box-shadow: 0 16px 34px rgba(30,101,211,.25); }
    .control-hero::after { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; right: -100px; top: -83px; border: 28px solid rgba(255,255,255,.06); }
    .control-device-line { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
    .control-device-line strong { font-size: 14px; }
    .control-device-line span { display: flex; align-items: center; gap: 5px; color: rgba(255,255,255,.78); font-size: 10px; }
    .control-device-line i { width: 6px; height: 6px; border-radius: 50%; background: #83f0d0; }
    .control-ring { --progress: 0deg; position: relative; z-index: 1; width: 174px; height: 174px; display: grid; place-items: center; margin: 18px auto 15px; border-radius: 50%; background: conic-gradient(#83f0d0 var(--progress), rgba(255,255,255,.17) 0); box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
    .control-ring::before { content: ""; position: absolute; width: 151px; height: 151px; border-radius: 50%; background: rgba(31,107,211,.94); box-shadow: inset 0 0 28px rgba(255,255,255,.05); }
    .control-time { position: relative; z-index: 1; text-align: center; }
    .control-time span { display: block; color: rgba(255,255,255,.72); font-size: 10px; }
    .control-time strong { display: block; margin: 7px 0 3px; font-size: 38px; letter-spacing: -.04em; }
    .control-time small { color: rgba(255,255,255,.72); font-size: 10px; }
    .control-stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3,1fr); padding-top: 14px; border-top: 1px solid rgba(255,255,255,.15); }
    .control-stats div { text-align: center; }
    .control-stats span { display: block; color: rgba(255,255,255,.66); font-size: 9px; }
    .control-stats strong { display: block; margin-top: 4px; font-size: 13px; }

    .setting-card { padding: 15px; margin-top: 13px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .setting-row + .setting-row { margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line); }
    .setting-label strong { display: block; font-size: 12px; }
    .setting-label span { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }
    .segmented { display: inline-flex; padding: 3px; border-radius: 11px; background: #f2f5fa; }
    .segmented button { min-width: 48px; border: 0; border-radius: 8px; padding: 6px 8px; color: var(--muted); background: transparent; font-size: 9px; cursor: pointer; }
    .segmented button.active { color: var(--brand); background: #fff; box-shadow: 0 3px 9px rgba(48,70,110,.09); font-weight: 700; }
    .duration-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 11px; }
    .duration-grid button { padding: 9px 4px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--text); font-size: 10px; cursor: pointer; }
    .duration-grid button.active { border-color: #a8c2fb; color: var(--brand); background: var(--brand-soft); font-weight: 700; }
    .primary-action { width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 13px; padding: 13px; border: 0; border-radius: 15px; color: #fff; background: linear-gradient(135deg,var(--brand),#3187ee); box-shadow: 0 10px 20px rgba(39,110,241,.2); cursor: pointer; font-size: 13px; font-weight: 700; }
    .primary-action.running { background: linear-gradient(135deg,#e55d68,#f0836d); box-shadow: 0 10px 20px rgba(229,93,104,.18); }
    .primary-action svg { width: 18px; height: 18px; }

    .health-score-card { display: flex; align-items: center; gap: 16px; padding: 16px; }

    function reportPage() {
      const s = reportSections[state.reportSection];
      return `<div class="report-hero"><div class="report-meta"><span>多模态综合检测报告</span><span class="report-badge">已完成</span></div><div class="report-main"><div class="report-gauge"><div><strong>82</strong><span>综合评估</span></div></div><div class="report-copy"><strong>整体状态良好</strong><p>本次共分析 24 项健康指标，较上次检测提升 4 分。</p></div></div></div><div class="report-tabs">${[['cardio','心肺功能'],['sleep','睡眠状态'],['stress','压力状态'],['body','身体机能']].map(x=>`<button class="${state.reportSection===x[0]?'active':''}" data-action="report-tab" data-section="${x[0]}">${x[1]}</button>`).join('')}</div><div class="report-section card"><div class="report-section-head"><strong>${s.title}指标</strong><span class="level-good">● ${s.level}</span></div><div class="indicator-list">${s.items.map(i=>`<div class="indicator-row"><span>${i[0]}</span><div class="indicator-bar"><i style="width:${i[1]}%"></i></div><strong>${i[2]}</strong></div>`).join('')}</div></div><div class="report-advice">${icon('sparkles')}<div><strong>健康建议</strong><br>${s.advice}</div></div><button class="primary-action" data-action="toast" data-message="报告分享卡片已生成">${icon('link')} 分享检测报告</button>`;
    }

    function profilePage() {
      return `<div class="profile-card"><div class="profile-top"><div class="profile-avatar">林</div><div class="profile-copy"><strong>林女士</strong><span>健康档案已完善 92%</span></div><span class="member-chip">黄金会员</span></div><div class="profile-stats"><div><strong>2,680</strong><span>积分</span></div><div><strong>8</strong><span>剩余次卡</span></div><div><strong>12</strong><span>本月氧疗</span></div></div></div><div class="section-head"><h2>我的订单</h2><button class="text-link" data-action="go" data-page="orders">全部订单</button></div><div class="order-shortcuts card"><button data-action="go" data-page="orders">${icon('wallet')}待付款<span class="count-dot">1</span></button><button data-action="go" data-page="orders">${icon('box')}待收货</button><button data-action="go" data-page="orders">${icon('calendar')}待服务<span class="count-dot">2</span></button><button data-action="external" data-target="售后服务">${icon('service')}退款/售后</button></div><div class="section-head"><h2>健康与设备</h2></div><div class="menu-list card"><button class="menu-row" data-action="go" data-page="devices"><span class="menu-row-icon" style="color:var(--brand);background:var(--brand-soft)">${icon('device')}</span><span>我的设备</span><small>2 台</small>${icon('chevron',14)}</button><button class="menu-row" data-action="go" data-page="report"><span class="menu-row-icon" style="color:var(--purple);background:var(--purple-soft)">${icon('report')}</span><span>我的检测报告</span><small>3 份</small>${icon('chevron',14)}</button><button class="menu-row" data-action="go" data-page="records"><span class="menu-row-icon" style="color:var(--aqua);background:var(--aqua-soft)">${icon('oxygen')}</span><span>我的氧疗记录</span><small>累计 36 次</small>${icon('chevron',14)}</button></div><div class="section-head"><h2>服务与设置</h2></div><div class="menu-list card"><button class="menu-row" data-action="toast" data-message="健康档案已打开"><span class="menu-row-icon" style="color:var(--orange);background:var(--orange-soft)">${icon('user')}</span><span>个人与健康档案</span>${icon('chevron',14)}</button><button class="menu-row" data-action="toast" data-message="数据授权记录已打开"><span class="menu-row-icon" style="color:var(--aqua);background:var(--aqua-soft)">${icon('shield')}</span><span>数据授权与隐私</span>${icon('chevron',14)}</button><button class="menu-row" data-action="toast" data-message="设置中心已打开"><span class="menu-row-icon" style="color:var(--purple);background:var(--purple-soft)">${icon('settings')}</span><span>系统设置</span>${icon('chevron',14)}</button></div>`;
    }

    function ordersPage() {
      return `<div class="sync-banner">${icon('sync')}以下订单和预约数据同步自客户原有商城系统，交易及售后操作将跳转至原小程序办理。</div><div class="filter-row"><button class="active">全部</button><button>商城订单</button><button>服务预约</button></div><div class="order-card card"><div class="order-store"><strong>泰瑞医疗官方商城</strong><span>待收货</span></div><div class="order-product"><div class="order-product-art">${icon('watch')}</div><div class="order-product-copy"><strong>泰瑞健康手环 S2</strong><span>星空灰 · 标准款 ×1</span><b>¥ 699.00</b></div></div><div class="order-actions"><button class="outline-btn" data-action="external" data-target="查看物流">查看物流</button><button class="outline-btn primary" data-action="external" data-target="订单详情">订单详情</button></div></div><div class="order-card card"><div class="order-store"><strong>泰瑞氧疗中心（滨江店）</strong><span style="color:var(--aqua)">待服务</span></div><div class="order-product"><div class="order-product-art" style="color:var(--aqua);background:var(--aqua-soft)">${icon('oxygen')}</div><div class="order-product-copy"><strong>专业舒缓氧疗 · 单次</strong><span>预约时间：8月22日 14:30</span><b>¥ 168.00</b></div></div><div class="order-actions"><button class="outline-btn" data-action="external" data-target="门店导航">门店导航</button><button class="outline-btn primary" data-action="external" data-target="预约详情">查看预约</button></div></div><div class="order-card card"><div class="order-store"><strong>泰瑞医疗官方商城</strong><span style="color:var(--muted)">已完成</span></div><div class="order-product"><div class="order-product-art">${icon('box')}</div><div class="order-product-copy"><strong>氧舱专用清洁护理套装</strong><span>标准套装 ×1</span><b>¥ 128.00</b></div></div><div class="order-actions"><button class="outline-btn" data-action="external" data-target="再次购买">再次购买</button><button class="outline-btn primary" data-action="external" data-target="订单详情">订单详情</button></div></div>`;
    }

    const pageRenderers = { home: homePage, devices: devicesPage, control: controlPage, health: healthPage, records: recordsPage, report: reportPage, orders: ordersPage, profile: profilePage };
    const pageTitles = { devices:'设备中心', control:'氧舱远程控制', health:'健康中心', records:'氧疗记录', report:'多模态检测报告', orders:'商城与预约', profile:'个人中心' };

    function render() {
      document.getElementById('appbar').innerHTML = state.page === 'home' ? header('', false) : header(pageTitles[state.page]);
      document.getElementById('screen').innerHTML = pageRenderers[state.page]();
      document.getElementById('screen').scrollTop = 0;
      document.getElementById('tabbar').innerHTML = tabPages.map(t => `<button class="${state.page===t.id?'active':''}" data-action="go" data-page="${t.id}">${icon(t.icon)}<span>${t.label}</span></button>`).join('');
      document.getElementById('screenMenu').innerHTML = pages.map(p => `<button class="${state.page===p.id?'active':''}" data-action="go" data-page="${p.id}"><span class="menu-icon">${icon(p.icon)}</span>${p.label}</button>`).join('');
    }

    function navigate(page) {
      if (!pageRenderers[page]) return;
      if (state.page !== page) state.previous = state.page;
      state.page = page;
      render();
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function openModal({ title, text, confirm='确认', action='generic', iconName='info' }) {
      state.modalAction = action;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').textContent = text;
      document.getElementById('modalConfirm').textContent = confirm;
      document.getElementById('modalIcon').innerHTML = icon(iconName);
      document.getElementById('modalLayer').classList.add('show');
    }

    function closeModal() { document.getElementById('modalLayer').classList.remove('show'); state.modalAction = null; }

    function startTimer() {
      clearInterval(state.tickTimer);
      if (!state.running) return;
      state.tickTimer = setInterval(() => {
        if (!state.running || state.remaining <= 0) {
          clearInterval(state.tickTimer);
          if (state.remaining <= 0) { state.running = false; showToast('本次氧疗已完成'); render(); }
          return;
        }
        state.remaining -= 1;
        const timeEl = document.getElementById('remainingTime');
        const ring = document.getElementById('controlRing');
        if (timeEl) timeEl.textContent = formatTime(state.remaining);
        if (ring) ring.style.setProperty('--progress', `${(state.duration*60-state.remaining)/(state.duration*60)*360}deg`);
      }, 1000);
    }

    function confirmModalAction() {
      const action = state.modalAction;
      closeModal();
      if (action === 'start') {
        state.running = true;
        state.remaining = state.duration * 60;
        render();
        startTimer();
        showToast('氧舱已安全启动');
      } else if (action === 'stop') {
        state.running = false;
        clearInterval(state.tickTimer);
        render();
        showToast('本次氧疗记录已保存');
      } else if (action === 'external') {
        showToast('正在打开客户原商城小程序…');
      } else if (action === 'bind') {
        showToast('已打开扫码绑定');
      } else if (action === 'record') {
        showToast('健康分析详情已打开');
      }
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'go') navigate(target.dataset.page);
      if (action === 'back') navigate(state.previous && state.previous !== state.page ? state.previous : 'home');
      if (action === 'toast') showToast(target.dataset.message || '功能已触发');
      if (action === 'period') { state.healthPeriod = target.dataset.period; render(); }
      if (action === 'record-filter') { state.recordFilter = target.dataset.filter; render(); }
      if (action === 'report-tab') { state.reportSection = target.dataset.section; render(); }
      if (action === 'mode' && !state.running) { state.mode = target.dataset.mode; render(); }
      if (action === 'duration' && !state.running) { state.duration = Number(target.dataset.duration); state.remaining = state.duration * 60; render(); }
      if (action === 'toggle-control') {
        if (state.running) openModal({title:'结束本次氧疗？',text:'结束后将停止氧舱运行，并保存本次设备与手环数据。',confirm:'确认结束',action:'stop',iconName:'pause'});
        else openModal({title:'确认开始氧疗',text:`将以${state.mode}模式运行 ${state.duration} 分钟。请确认舱门关闭、环境安全且手环已正常佩戴。`,confirm:'安全启动',action:'start',iconName:'shield'});
      }
      if (action === 'external') openModal({title:`前往${target.dataset.target || '原商城'}`,text:'该业务由客户原有商城小程序提供，泰瑞医疗小程序将携带当前用户身份跳转办理。',confirm:'继续前往',action:'external',iconName:'link'});
      if (action === 'bind-device') openModal({title:'绑定新设备',text:'请扫描氧舱或手环机身二维码，完成设备验证与绑定。',confirm:'开始扫码',action:'bind',iconName:'device'});
      if (action === 'record-detail') openModal({title:'氧疗效果详情',text:'本次氧疗已关联氧舱运行数据和同时段手环健康数据，可进一步查看完整趋势分析。',confirm:'查看分析',action:'record',iconName:'trend'});
      if (action === 'sync') {
        const svg = target.querySelector('svg');
        if (svg) svg.classList.add('spin');
        target.disabled = true;
        setTimeout(() => { showToast('手环数据同步完成'); if (state.page==='devices' || state.page==='health') render(); }, 900);
      }
      if (action === 'modal-cancel') closeModal();
      if (action === 'modal-confirm') confirmModalAction();
    });

    document.getElementById('sideBrandIcon').innerHTML = icon('logo');
    const now = new Date();
    document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    render();
  </script>
</body>
</html>
